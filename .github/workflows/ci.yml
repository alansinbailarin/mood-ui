name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library (typecheck, build, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `build` runs vue-tsc before vite, so this is also the typecheck.
      - name: Build library
        run: pnpm --filter mood-ui build

      - name: Run library tests
        run: pnpm --filter mood-ui test

      - name: Run showroom tests
        run: pnpm --filter showroom test

      # Fails on missing composable docs or when llms-full.txt passes its cap.
      - name: Generate llms.txt
        run: pnpm --filter showroom llms
